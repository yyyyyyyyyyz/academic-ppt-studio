[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-ppt-design-backend"
version = "4.0.0"
description = "Academic PPT Design Studio & Scientific Figure Factory Backend (v4.0)"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
  "python-pptx>=1.0.2",
  "python-docx>=1.1.2",
  "pypdf>=5.0.0",
  "mcp>=1.2.0",
  "matplotlib>=3.9.0",
  "pillow>=10.4.0",
  "numpy>=2.0.0",
  "rdkit>=2024.9.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
science = ["scipy>=1.14.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
