name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "Skipping HF Spaces sync: configure HF_TOKEN and HF_SPACE_ID repository secrets first."
            exit 0
          fi
          git push --force "https://hf:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}" HEAD:refs/heads/main
