services:
  - type: web
    name: academic-ppt-studio
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: LLM_PROVIDER_MODE
        value: auto
      - key: FIGURE_PROVIDER_MODE
        value: local
      - key: DECK_TTL_HOURS
        value: "24"
      - key: MAX_UPLOAD_MB
        value: "20"
